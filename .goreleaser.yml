version: 2

project_name: hopsule

before:
  hooks:
    - go mod tidy

builds:
  - id: hopsule
    binary: hopsule
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: hopsule
    name_template: "hopsule-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - id: hopsule
    package_name: hopsule
    vendor: Hopsule
    homepage: https://hopsule.com
    maintainer: Hopsule <hello@hopsule.com>
    description: "Decision-first, context-aware, portable memory system CLI"
    license: MIT
    formats:
      - deb
      - rpm

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

brews:
  - repository:
      owner: Hopsule
      name: homebrew-tap
      token: "{{ .Env.GH_PAT }}"
    directory: Formula
    homepage: https://hopsule.com
    description: "Decision-first, context-aware, portable memory system CLI"
    license: MIT
    install: |
      bin.install "hopsule"
    test: |
      system "#{bin}/hopsule", "--version"

scoops:
  - repository:
      owner: Hopsule
      name: scoop-bucket
      token: "{{ .Env.GH_PAT }}"
    homepage: https://hopsule.com
    description: "Decision-first, context-aware, portable memory system CLI"
    license: MIT

release:
  github:
    owner: Hopsule
    name: cli-tool
  draft: false
  prerelease: false
  name_template: "v{{.Version}}"
  extra_files:
    - glob: ./npm/package.json
