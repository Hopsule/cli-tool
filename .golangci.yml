version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Scanln
        - (io.Closer).Close
        - (*os.File).Close
        - (*os.File).WriteString
        - (*text/tabwriter.Writer).Flush
        - encoding/json.Unmarshal
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST1000"
        - "-ST1020"
        - "-ST1021"
  exclusions:
    rules:
      - linters:
          - errcheck
        text: "resp.Body.Close"
      - linters:
          - errcheck
        text: "viper.BindEnv"
      - linters:
          - errcheck
        text: "config.SaveConfig"
      - linters:
          - errcheck
        text: "openBrowser"
      - path: _test\.go
        linters:
          - errcheck
